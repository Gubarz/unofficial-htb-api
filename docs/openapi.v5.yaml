openapi: 3.0.4
info:
  contact:
    name: ' '
  description: The undocumented public API v5 for the Hack The Box platform. This OpenAPI specification is community-maintained and reverse-engineered. This project  is not affiliated with or endorsed by HTB.
  license:
    name: The Unlicense
    url: https://unlicense.org/
  title: HTB Unofficial API v5
  version: v0.4.0
servers:
  - description: HTB API
    url: https://labs.hackthebox.com/api/v5
security:
  - bearer: []
tags:
  - description: Endpoints related to Connections
    name: Connections
    x-displayName: Connections
  - description: Endpoints related to Machines
    name: Machines
    x-displayName: Machines
  - description: Endpoints related to Universities
    name: University
    x-displayName: University
  - description: Endpoints related to User
    name: User
    x-displayName: User
  - description: Endpoints related to VM
    name: VM
    x-displayName: VM
  - name: Subscription
    description: Subscription plans and pricing.
  - name: Season
    description: Seasonal content, league standings, progress, and rewards.
    x-displayName: Season
paths:
  /connections:
    get:
      description: VPN Connections
      operationId: getConnections
      responses:
        '200':
          $ref: '#/components/responses/ConnectionsResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: Get VPN Connections
      tags:
        - Connections
  /machine/own:
    post:
      description: Submit flag
      operationId: postMachineOwn
      requestBody:
        $ref: '#/components/requestBodies/MachineOwnRequest'
      responses:
        '200':
          $ref: '#/components/responses/MachineOwnResponse'
        '400':
          $ref: '#/components/responses/MachineOwn400Response'
      summary: Submit flag
      tags:
        - Machines
  /machines:
    get:
      description: Machines
      operationId: getMachines
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/MachineDifficulty'
        - $ref: '#/components/parameters/Os'
        - $ref: '#/components/parameters/ShowCompleted'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortType'
        - $ref: '#/components/parameters/Free'
        - $ref: '#/components/parameters/Todo'
        - $ref: '#/components/parameters/SpTier'
      responses:
        '200':
          $ref: '#/components/responses/MachinesResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: Get Machines
      tags:
        - Machines
  /universities:
    get:
      description: Universities
      operationId: getUniversities
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/UniversityName'
        - $ref: '#/components/parameters/UniversityCountryCode'
        - $ref: '#/components/parameters/UniversitySortBy'
        - $ref: '#/components/parameters/UniversitySortType'
      responses:
        '200':
          $ref: '#/components/responses/UniversitiesResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: Get Universities
      tags:
        - University
  /universities/{universityId}/stats:
    get:
      description: University Stats
      operationId: getUniversityStats
      parameters:
        - $ref: '#/components/parameters/UniversityId'
      responses:
        '200':
          $ref: '#/components/responses/UniversityStatsResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: Get University Stats
      tags:
        - University
  /user/profile/content/{userId}:
    get:
      description: User Profile Content
      operationId: getUserProfileContent
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserProfileContentType'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/UserProfileContentResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: User Profile Content
      tags:
        - User
  /user/dashboard/favorites:
    get:
      description: Lists the user's favorite content.
      operationId: getUserDashboardFavorites
      responses:
        '200':
          $ref: '#/components/responses/UserDashboardFavoritesResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: User Dashboard Favorites
      tags:
        - User
  /user/dashboard/inprogress:
    get:
      description: Lists content the user is currently progressing through.
      operationId: getUserDashboardInProgress
      responses:
        '200':
          $ref: '#/components/responses/UserDashboardInProgressResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: User Dashboard In Progress
      tags:
        - User
  /user/dashboard/recommended:
    get:
      description: Lists content recommended for the user.
      operationId: getUserDashboardRecommended
      responses:
        '200':
          $ref: '#/components/responses/UserDashboardRecommendedResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: User Dashboard Recommended
      tags:
        - User
  /user/profile/content/{userId}/counts:
    get:
      description: User Profile Content Counts
      operationId: getUserProfileContentCounts
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserProfileContentCountsResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: User Profile Content Counts
      tags:
        - User
  /user/profile/activity/{userId}:
    get:
      description: User Profile Activity
      operationId: getUserProfileActivity
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/UserProfileActivityResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: User Profile Activity
      tags:
        - User
  /virtual_machine/active:
    get:
      operationId: getVirtualMachineActive
      responses:
        '200':
          $ref: '#/components/responses/VirtualMachineActiveResponse'
        '400':
          $ref: '#/components/responses/Generic400Response'
      summary: Get Active Virtual Machine
      tags:
        - VM
      description: 'Returns the active virtual machine, or info: null when no VM is active.'
  /subscriptions/pricing:
    get:
      description: Lists subscription products, plans, and prices.
      operationId: getSubscriptionPricing
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionPricingSourceResponse'
      summary: Get subscription pricing
      tags:
        - Subscription
  /user/dashboard/inprogress/{contentType}/{contentId}:
    delete:
      summary: Remove content from the in-progress dashboard
      description: Removes the identified content from the in-progress dashboard.
      operationId: deleteSourceDashboardInProgressDelete
      tags:
        - User
      parameters:
        - name: contentType
          in: path
          required: true
          description: Content kind from the dashboard item's type.
          schema:
            type: string
          example: machine
        - name: contentId
          in: path
          required: true
          description: Identifier of the dashboard content item.
          schema: {}
      responses:
        2XX:
          description: Successful removal.
  /season/content/active:
    get:
      operationId: getSeasonActiveContent
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/SeasonActiveContentResponse'
      summary: Get active seasonal content
      tags:
        - Season
      description: Returns the current offensive and defensive seasonal content.
  /season/user/{userId}/ranks:
    get:
      operationId: getSeasonUserRanks
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/SeasonUserRanksResponse'
      summary: Get a user's season ranking history
      tags:
        - Season
      description: Returns a user's rankings and progress across seasons.
  /season/{seasonId}/content:
    get:
      operationId: getSeasonContent
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          $ref: '#/components/responses/SeasonContentResponse'
      summary: Get season content
      tags:
        - Season
      description: Returns the offensive and defensive content for a season.
  /season/{seasonId}/leaderboard:
    get:
      operationId: getSeasonLeaderboard
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/SeasonLeaderboardEntity'
        - $ref: '#/components/parameters/SeasonLeaderboardFlavor'
        - $ref: '#/components/parameters/SeasonLeaderboardCountry'
        - $ref: '#/components/parameters/SeasonLeaderboardKeyword'
        - $ref: '#/components/parameters/SeasonLeaderboardLeagueRank'
        - $ref: '#/components/parameters/SeasonLeaderboardPage'
        - $ref: '#/components/parameters/SeasonLeaderboardPerPage'
      responses:
        '200':
          $ref: '#/components/responses/SeasonLeaderboardResponse'
      summary: Get season leaderboard
      tags:
        - Season
      description: Returns a paginated season leaderboard for the selected entity type and league.
  /season/{seasonId}/leaderboard/top:
    get:
      operationId: getSeasonLeaderboardTop
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/SeasonLeaderboardEntity'
        - $ref: '#/components/parameters/SeasonLeaderboardFlavor'
        - $ref: '#/components/parameters/SeasonLeaderboardTopNumber'
      responses:
        '200':
          $ref: '#/components/responses/SeasonLeaderboardTopResponse'
      summary: Get top season leaderboard entries
      tags:
        - Season
      description: Returns the top-ranked players or teams for a season and league.
  /season/{seasonId}/rewards:
    get:
      operationId: getSeasonRewards
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          $ref: '#/components/responses/SeasonRewardsResponse'
      summary: Get season rewards
      tags:
        - Season
      description: Returns the reward groups and top-earner rewards for a season.
  /season/{seasonId}/user/rank:
    get:
      operationId: getSeasonUserRank
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          $ref: '#/components/responses/SeasonUserRankResponse'
      summary: Get current user season rank
      tags:
        - Season
      description: Returns the signed-in user's league rankings and progress for a season.
components:
  securitySchemes:
    bearer:
      description: Need to create token on app.hackthebox.com
      scheme: bearer
      type: http
  schemas:
    ConnectionLabEntry:
      allOf:
        - $ref: '#/components/schemas/ConnectionBase'
        - type: object
          properties:
            type:
              type: string
              enum:
                - labs
                - starting_point
                - fortresses
                - sherlocks
    ConnectionProLabEntry:
      allOf:
        - $ref: '#/components/schemas/ConnectionBase'
        - type: object
          properties:
            type:
              type: string
              enum:
                - prolab
            pro_lab:
              $ref: '#/components/schemas/ConnectionProlab'
          required:
            - pro_lab
    ConnectionCompetitiveEntry:
      allOf:
        - $ref: '#/components/schemas/ConnectionBase'
        - type: object
          properties:
            type:
              type: string
              enum:
                - competitive
            available:
              type: boolean
            machine:
              $ref: '#/components/schemas/ConnectionMachine'
            available_at:
              type: string
              format: date-time
          required:
            - available
    ConnectionAssignedServer:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        friendly_name:
          type: string
        current_clients:
          type: integer
        location:
          type: string
    ConnectionBase:
      type: object
      properties:
        type:
          type: string
        location_type_friendly:
          type: string
          nullable: true
        assigned_server:
          $ref: '#/components/schemas/ConnectionAssignedServer'
      required:
        - type
    ConnectionProlab:
      properties:
        id:
          type: integer
        name:
          type: string
        identifier:
          type: string
      type: object
    ConnectionMachine:
      properties:
        id:
          type: integer
        name:
          type: string
        avatar_thumb_url:
          type: string
      type: object
    Connection:
      oneOf:
        - $ref: '#/components/schemas/ConnectionLabEntry'
        - $ref: '#/components/schemas/ConnectionProLabEntry'
        - $ref: '#/components/schemas/ConnectionCompetitiveEntry'
      discriminator:
        propertyName: type
        mapping:
          labs: '#/components/schemas/ConnectionLabEntry'
          starting_point: '#/components/schemas/ConnectionLabEntry'
          fortresses: '#/components/schemas/ConnectionLabEntry'
          prolab: '#/components/schemas/ConnectionProLabEntry'
          competitive: '#/components/schemas/ConnectionCompetitiveEntry'
          sherlocks: '#/components/schemas/ConnectionLabEntry'
    ConnectionsData:
      items:
        $ref: '#/components/schemas/Connection'
      type: array
    ConnectionsResponse:
      description: Schema definition for Connections Response
      properties:
        data:
          $ref: '#/components/schemas/ConnectionsData'
      title: Connections Response
      type: object
    Generic400Response:
      description: Schema definition for Generic Error Response
      properties:
        message:
          example: Some Error Message.
          type: string
        status:
          example: 400
          type: integer
      required:
        - message
        - status
      title: Generic Error Response
      type: object
    MachineOwnRequest:
      description: Schema definition for Own Request
      properties:
        difficulty:
          example: 50
          type: integer
        flag:
          description: MD5 hash of the machine flag
          example: 0cc175b9c0f1b6a831c399e269772661
          type: string
        id:
          description: The machine ID
          example: 597
          type: integer
      required:
        - id
        - flag
      title: Own Request
      type: object
    NewRank:
      properties:
        id:
          example: 5
          type: integer
        text:
          nullable: true
          type: string
      type: object
    RankUpdate:
      properties:
        changed:
          example: false
          type: boolean
        newRank:
          $ref: '#/components/schemas/NewRank'
          nullable: true
          type: object
      type: object
    MachineOwnResponse:
      description: Schema definition for Machine Own Response
      properties:
        blood_points:
          example: 0
          type: integer
        blood_taken:
          example: 0
          type: integer
        id:
          example: 665
          type: integer
        is_starting_point:
          example: false
          type: boolean
        league_rank:
          $ref: '#/components/schemas/RankUpdate'
          nullable: true
          type: object
        machine_completed:
          example: false
          type: boolean
        machine_pwned:
          example: false
          type: boolean
        machine_state:
          example: open
          type: string
        message:
          example: You pwned the User Flag!
          type: string
        own_type:
          enum:
            - Root
            - User
          example: User
          type: string
        points:
          example: 50
          type: integer
        status:
          example: 200
          type: integer
        success:
          example: true
          type: boolean
        user_rank:
          $ref: '#/components/schemas/RankUpdate'
          nullable: true
          type: object
      required:
        - message
        - status
        - success
        - own_type
        - id
        - points
        - machine_completed
        - machine_pwned
        - machine_state
        - is_starting_point
        - blood_taken
        - blood_points
      title: Own Response
      type: object
    MachineOwnErrorResponse:
      description: Schema definition for Own Error Response
      properties:
        message:
          example: Incorrect flag.
          type: string
        status:
          example: 400
          type: integer
      required:
        - message
        - status
      title: Own Error Response
      type: object
    FeedbackForChart:
      type: object
      properties:
        counterCake:
          type: integer
        counterVeryEasy:
          type: integer
        counterEasy:
          type: integer
        counterTooEasy:
          type: integer
        counterMedium:
          type: integer
        counterBitHard:
          type: integer
        counterHard:
          type: integer
        counterTooHard:
          type: integer
        counterExHard:
          type: integer
        counterBrainFuck:
          type: integer
    MachinePlayInfo:
      type: object
      properties:
        isSpawned:
          type: boolean
          nullable: true
        isSpawning:
          type: boolean
          nullable: true
        isActive:
          type: boolean
          nullable: true
        active_player_count:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        life_remaining:
          type: integer
          nullable: true
    MachineLabel:
      type: object
      properties:
        color:
          type: string
        name:
          type: string
    MachineCreator:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
          nullable: true
        isRespected:
          type: boolean
        profile_url:
          type: string
          nullable: true
    MachineRetiring:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
        os:
          type: string
        difficultyText:
          type: string
    MachinesItem:
      description: Schema definition for a Machine card
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
        os:
          type: string
        points:
          type: integer
        rating:
          type: number
        ratingCount:
          type: integer
        releaseDate:
          type: string
          format: date-time
        retiredDate:
          type: string
          format: date-time
          nullable: true
        free:
          type: boolean
        difficulty:
          type: integer
        difficultyText:
          type: string
        userOwnsCount:
          type: integer
        authUserInUserOwns:
          type: boolean
        rootOwnsCount:
          type: integer
        authUserHasReviewed:
          type: boolean
        authUserInRootOwns:
          type: boolean
        todo:
          type: boolean
        competitive:
          type: boolean
        active:
          type: boolean
          nullable: true
        feedbackForChart:
          $ref: '#/components/schemas/FeedbackForChart'
        ip:
          type: string
          nullable: true
        playInfo:
          $ref: '#/components/schemas/MachinePlayInfo'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/MachineLabel'
        recommended:
          type: boolean
        priceTier:
          type: integer
        requiredSubscription:
          type: string
          nullable: true
        firstCreator:
          $ref: '#/components/schemas/MachineCreator'
        cocreators:
          type: array
          items:
            $ref: '#/components/schemas/MachineCreator'
        retiring:
          $ref: '#/components/schemas/MachineRetiring'
        state:
          type: string
        taskCompletionPercentage:
          type: string
        spFlag:
          type: integer
        isSingleFlag:
          type: boolean
      required:
        - id
        - name
        - avatar
        - os
        - points
        - rating
        - ratingCount
        - releaseDate
        - free
        - difficulty
        - difficultyText
        - userOwnsCount
        - authUserInUserOwns
        - rootOwnsCount
        - authUserHasReviewed
        - authUserInRootOwns
        - todo
        - competitive
        - feedbackForChart
        - playInfo
        - labels
        - recommended
        - priceTier
        - firstCreator
        - cocreators
        - state
        - taskCompletionPercentage
        - spFlag
        - isSingleFlag
    MachinesData:
      type: array
      items:
        $ref: '#/components/schemas/MachinesItem'
    Links:
      description: Schema definition for Links
      properties:
        first:
          example: https://labs.hackthebox.com/api/v4/prolab/1/reviews?page=1
          type: string
        last:
          example: https://labs.hackthebox.com/api/v4/prolab/1/reviews?page=11
          type: string
        next:
          example: https://labs.hackthebox.com/api/v4/prolab/1/reviews?page=2
          nullable: true
          type: string
        prev:
          example: null
          nullable: true
          type: string
      title: Links
      type: object
    PaginationLink:
      description: Schema definition for Pagination Link
      properties:
        active:
          example: true
          type: boolean
        label:
          example: '1'
          type: string
        url:
          example: https://labs.hackthebox.com/api/v4/prolab/1/reviews?page=1
          nullable: true
          type: string
      title: Pagination Link
      type: object
    PaginationLinks:
      items:
        $ref: '#/components/schemas/PaginationLink'
      type: array
    Meta:
      description: Schema definition for Meta
      properties:
        current_page:
          example: 1
          type: integer
        from:
          example: 1
          type: integer
          nullable: true
        last_page:
          example: 11
          type: integer
        links:
          $ref: '#/components/schemas/PaginationLinks'
        path:
          example: https://labs.hackthebox.com/api/v4/prolab/1/reviews
          type: string
        per_page:
          example: 15
          type: integer
        to:
          example: 15
          type: integer
          nullable: true
        total:
          example: 162
          type: integer
      title: Meta
      type: object
    MachinesResponse:
      description: Schema definition for Machines list responses
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MachinesData'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - links
        - meta
    UniversitiesItem:
      description: Schema definition for a University list item
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
          nullable: true
        country_code:
          type: string
        country_name:
          type: string
        users_count:
          type: integer
        respected_by_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - avatar
        - country_code
        - country_name
        - users_count
        - respected_by_count
        - created_at
    UniversitiesData:
      type: array
      items:
        $ref: '#/components/schemas/UniversitiesItem'
    UniversitiesResponse:
      description: Schema definition for Universities list responses
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UniversitiesData'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - links
        - meta
    UniversityStatsResponse:
      description: Schema definition for University Stats responses
      type: object
      properties:
        rank:
          type: string
        total_points:
          type: integer
        members:
          type: integer
        respects:
          type: integer
        machine_solves:
          type: integer
        challenge_solves:
          type: integer
        sherlock_solves:
          type: integer
        total_bloods:
          type: integer
      required:
        - rank
        - total_points
        - members
        - respects
        - machine_solves
        - challenge_solves
        - sherlock_solves
        - total_bloods
    UserProfileContentItemMachine:
      description: Machine entry returned by the user profile content feed.
      type: object
      properties:
        id:
          type: integer
          description: Machine identifier.
        name:
          type: string
          description: Machine display name.
        os:
          type: string
          description: Operating system of the machine.
        machineAvatar:
          type: string
          format: uri
          description: Absolute URL to the machine avatar.
        difficulty:
          type: string
          description: Machine difficulty label.
        starRating:
          type: number
          format: float
          description: Average star rating.
        userOwnCount:
          type: integer
          description: Number of user owns for the profile owner.
        rootOwnCount:
          type: integer
          description: Number of root owns for the profile owner.
        releaseDate:
          type: string
          format: date-time
          description: Machine release timestamp.
        ratingCount:
          type: integer
          description: Number of ratings submitted for the machine.
      required:
        - id
        - name
        - os
        - machineAvatar
        - difficulty
        - starRating
        - userOwnCount
        - rootOwnCount
        - releaseDate
        - ratingCount
    UserProfileContentItemChallenge:
      description: Challenge entry returned by the user profile content feed.
      type: object
      properties:
        id:
          type: integer
          description: Challenge identifier.
        name:
          type: string
          description: Challenge display name.
        categoryName:
