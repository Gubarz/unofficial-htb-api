  requestBodies:
    MachineOwnRequest:
      content:
        application/json:
          examples:
            MachineOwnRequest:
              $ref: '#/components/examples/MachineOwnRequest'
            MachineOwnRequestWithDifficulty:
              $ref: '#/components/examples/MachineOwnRequestWithDifficulty'
          schema:
            $ref: '#/components/schemas/MachineOwnRequest'
        application/x-www-form-urlencoded:
          examples:
            MachineOwnRequest:
              $ref: '#/components/examples/MachineOwnRequest'
            MachineOwnRequestWithDifficulty:
              $ref: '#/components/examples/MachineOwnRequestWithDifficulty'
          schema:
            $ref: '#/components/schemas/MachineOwnRequest'
      description: Body to post machine flag
      required: true
  headers:
    XRateLimitHeader:
      description: Total requests allowed
      schema:
        example: 15
        format: int
        type: integer
    XRateLimitRemainingHeader:
      description: Remaining requests allowed
      schema:
        example: 14
        format: int
        type: integer
  parameters:
    PerPage:
      description: Limit results per page
      in: query
      name: per_page
      required: false
      schema:
        maximum: 100
        minimum: 5
        type: integer
    Page:
      description: Page number
      in: query
      name: page
      required: false
      schema:
        type: integer
    State:
      description: Filter by state. You can provide multiple values. For example, state=active&state=retired.
      explode: true
      in: query
      name: state
      schema:
        items:
          enum:
            - active
            - retired
            - unreleased
          type: string
        type: array
      style: form
    Keyword:
      description: Search String
      in: query
      name: keyword
      required: false
      schema:
        example: hack
        type: string
    MachineDifficulty:
      description: Filter by difficulty level
      explode: true
      in: query
      name: difficulty[]
      required: false
      schema:
        items:
          enum:
            - easy
            - medium
            - hard
            - insane
          type: string
        type: array
      style: form
    Os:
      description: Filter by os
      explode: true
      in: query
      name: os[]
      required: false
      schema:
        items:
          enum:
            - linux
            - windows
            - freebsd
            - openbsd
            - other
          type: string
        type: array
      style: form
    ShowCompleted:
      description: Omit for both
      in: query
      name: showCompleted
      required: false
      schema:
        enum:
          - incomplete
          - complete
        type: string
    SortBy:
      description: Field to sort by
      in: query
      name: sort_by
      required: false
      schema:
        enum:
          - release_date
          - name
          - user_owns
          - system_owns
          - rating
          - user_difficulty
        type: string
    SortType:
      description: Sort type (asc or desc)
      in: query
      name: sort_type
      required: false
      schema:
        enum:
          - asc
          - desc
        type: string
    Free:
      description: limits retired results to free machines, values must either be 1 for true or 0 for false or omit the parameter for no filter
      in: query
      name: free
      required: false
      schema:
        enum:
          - 1
          - 0
        type: integer
    Todo:
      description: Filter ToDo
      in: query
      name: todo
      required: false
      schema:
        enum:
          - 1
        format: int
        type: integer
    SpTier:
      description: Filter by StartingPoint Tier (tier + 1), ie if you want StartingPoint 0 machines you use spTier=1
      explode: true
      in: query
      name: spTier
      required: false
      schema:
        enum:
          - 1
          - 2
          - 3
        format: int
        type: integer
    UniversityName:
      description: Filter universities by name.
      in: query
      name: name
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
    UniversityCountryCode:
      description: Filter universities by country code.
      in: query
      name: country_code
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
    UniversitySortBy:
      description: Field to sort by, such as `name`, `respected_by_count`, or `users_count`.
      in: query
      name: sort_by
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
    UniversitySortType:
      description: Sort direction.
      in: query
      name: sort_type
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
        enum:
          - asc
          - desc
    UniversityId:
      description: ID of the university
      in: path
      name: universityId
      required: true
      schema:
        type: integer
    UserId:
      description: ID of the user
      in: path
      name: userId
      required: true
      schema:
        type: integer
    UserProfileContentType:
      description: Product type to filter by
      in: query
      name: type
      required: true
      schema:
        enum:
          - machine
          - challenge
          - sherlock
        type: string
    SeasonId:
      in: path
      name: seasonId
      required: true
      schema:
        type: integer
      example: 21
      description: Season ID.
    SeasonLeaderboardEntity:
      in: query
      name: entity
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
        enum:
          - players
          - teams
      example: players
      description: Whether to rank players or teams.
    SeasonLeaderboardFlavor:
      in: query
      name: seasonFlavor
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
