      description: League to rank. Use `red` for offensive, `blue` for defensive, or `purple` for combined.
    SeasonLeaderboardCountry:
      in: query
      name: country
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
      description: Filter by country.
    SeasonLeaderboardKeyword:
      in: query
      name: keyword
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
      description: Search term.
    SeasonLeaderboardLeagueRank:
      in: query
      name: league_rank
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: string
      description: Filter by league tier.
    SeasonLeaderboardPage:
      in: query
      name: page
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: integer
      example: 1
      description: Page number.
    SeasonLeaderboardPerPage:
      in: query
      name: per_page
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: integer
      example: 15
      description: Number of entries per page.
    SeasonLeaderboardTopNumber:
      in: query
      name: number
      required: false
      schema:
        x-go-type-skip-optional-pointer: false
        type: integer
      example: 3
      description: Number of top-ranked entries to return.
