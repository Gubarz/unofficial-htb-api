components:
  securitySchemes:
    bearer:
      description: Need to create token on app.hackthebox.com
      scheme: bearer
      type: http
info:
  contact:
    name: ' '
  description: >-
    The undocumented public API v5 for the Hack The Box platform. This OpenAPI
    specification is community-maintained and reverse-engineered. This project 
    is not affiliated with or endorsed by HTB.
  license:
    name: The Unlicense
    url: https://unlicense.org/
  title: HTB Unofficial API v5
  version: v0.4.0
openapi: 3.0.4
paths:
  /connections:
    $ref: paths/connections.yaml
  /machine/own:
    $ref: paths/machine_own.yaml
  /machines:
    $ref: paths/machines.yaml
  /universities:
    $ref: paths/universities.yaml
  /universities/{universityId}/stats:
    $ref: paths/universities_{universityId}_stats.yaml
  /user/profile/content/{userId}:
    $ref: paths/user_profile_content_{userId}.yaml
  /user/dashboard/favorites:
    $ref: paths/user_dashboard_favorites.yaml
  /user/dashboard/inprogress:
    $ref: paths/user_dashboard_inprogress.yaml
  /user/dashboard/recommended:
    $ref: paths/user_dashboard_recommended.yaml
  /user/profile/content/{userId}/counts:
    $ref: paths/user_profile_content_{userId}_counts.yaml
  /user/profile/activity/{userId}:
    $ref: paths/user_profile_activity_{userId}.yaml
  /virtual_machine/active:
    $ref: paths/virtual_machine_active.yaml
  /subscriptions/pricing:
    $ref: paths/subscriptions_pricing.yaml
  /user/dashboard/inprogress/{contentType}/{contentId}:
    $ref: paths/user_dashboard_inprogress_{contentType}_{contentId}.yaml
  /season/content/active:
    $ref: paths/season_content_active.yaml
  /season/user/{userId}/ranks:
    $ref: paths/season_user_{userId}_ranks.yaml
  /season/{seasonId}/content:
    $ref: paths/season_{seasonId}_content.yaml
  /season/{seasonId}/leaderboard:
    $ref: paths/season_{seasonId}_leaderboard.yaml
  /season/{seasonId}/leaderboard/top:
    $ref: paths/season_{seasonId}_leaderboard_top.yaml
  /season/{seasonId}/rewards:
    $ref: paths/season_{seasonId}_rewards.yaml
  /season/{seasonId}/user/rank:
    $ref: paths/season_{seasonId}_user_rank.yaml
security:
  - bearer: []
servers:
  - description: HTB API
    url: https://labs.hackthebox.com/api/v5
